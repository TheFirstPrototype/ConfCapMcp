# nginx site for the hosted MCP server: https://mcp.deafassistant.com/mcp  (install as /etc/nginx/sites-available/confcap-mcp)
# Put `limit_req_zone` in the http {} block (for example /etc/nginx/conf.d/confcap-mcp-limit.conf), not inside server {}:
#   limit_req_zone $binary_remote_addr zone=confcap_mcp:10m rate=5r/s;
server {
    listen 80;
    server_name mcp.deafassistant.com;
    # certbot --nginx -d mcp.deafassistant.com  adds the 443 block and the redirect.

    client_max_body_size 256k;          # matches the server's own limit

    location = /mcp {
        limit_req zone=confcap_mcp burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # SET, not appended: the server trusts this header (TRUST_PROXY=1), so a client must not be able to supply its own.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
    location = /healthz { proxy_pass http://127.0.0.1:8787; access_log off; }
    location / { return 404; }

    # Never log credentials: the key travels in the Authorization header, which nginx does not log by default.
}
